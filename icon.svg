<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#1a1f30"/>
      <stop offset="55%" stop-color="#121522"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="18%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#7c6cf0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="100%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d8ffb"/>
      <stop offset="100%" stop-color="#5a4fd6"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fd9c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#cfd3f5"/>
      <stop offset="100%" stop-color="#8a7af5"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glowViolet)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glowTeal)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- atom / orbit mark -->
  <g transform="translate(256 262)" filter="url(#softShadow)">
    <ellipse cx="0" cy="0" rx="168" ry="66" fill="none" stroke="url(#ring1)" stroke-width="13" stroke-linecap="round" transform="rotate(-60)"/>
    <ellipse cx="0" cy="0" rx="168" ry="66" fill="none" stroke="url(#ring2)" stroke-width="13" stroke-linecap="round" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="168" ry="66" fill="none" stroke="url(#ring3)" stroke-width="13" stroke-linecap="round" transform="rotate(0)"/>

    <!-- orbiting nodes -->
    <circle cx="0" cy="-66" r="14" fill="#ffffff"/>
    <circle cx="145.5" cy="33" r="10" fill="#3fd9c7"/>
    <circle cx="-145.5" cy="33" r="10" fill="#9d8ffb"/>

    <!-- nucleus -->
    <circle cx="0" cy="0" r="40" fill="url(#nucleus)"/>
  </g>
</svg>
